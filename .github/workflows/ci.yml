name: AccessLens CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Test Suites
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          GEMMA_PRIMARY_MODEL: gemma-4-31b-it
          GEMMA_FALLBACK_MODEL: gemma-3-27b-it
          ENABLE_DEMO_FALLBACKS: "true"
