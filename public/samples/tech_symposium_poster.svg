  <text x="90" y="985" fill="#71717a" font-family="system-ui, sans-serif" font-size="13">Notice: Valid student ID mandatory. [Lunch coupons issued at...</text>
  <text x="440" y="985" fill="#52525b" font-family="system-ui, sans-serif" font-size="13" font-style="italic">[cropped: corner torn]</text>

